name: Update NFL Calendar

on:
  schedule:
    # Active NFL season: every 15 minutes, August through February.
    - cron: '7,22,37,52 * * 1,2,8-12 *'
    # Offseason: once each Tuesday at 08:17 UTC.
    - cron: '17 8 * 3-7 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get ISO week key
        id: date
        run: echo "week=$(date -u +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Restore schedule cache
        uses: actions/cache/restore@v5
        with:
          path: cache/schedule.json
          key: nfl-schedule-${{ steps.date.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            nfl-schedule-${{ steps.date.outputs.week }}-
            nfl-schedule-

      - name: Generate calendar
        run: python src/main.py

      - name: Save schedule cache
        uses: actions/cache/save@v5
        with:
          path: cache/schedule.json
          key: nfl-schedule-${{ steps.date.outputs.week }}-${{ github.run_id }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: false
          commit_message: 'Update NFL calendar'
